[project]
name = "fin-scrape"
version = "0.3.0"
description = "AI-powered financial news intelligence engine with vendored Scrapling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Vendored Scrapling engine dependencies
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "curl-cffi>=0.7.0",
    "orjson>=3.9.0",
    "w3lib>=2.1.0",
    "tld>=0.13.0",
    "browserforge>=1.1.0",
    "patchright>=1.0.0",
    "msgspec>=0.18.0",
    "typing-extensions>=4.0.0",
    # Core
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    # RSS parsing
    "feedparser>=6.0.0",
    # Financial data
    "yfinance>=0.2.30",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
