# WorldFin — local-first compose (Phase 0: postgres + api).
# Worker, web, ollama, redis arrive in later phases; redis is wired now as an
# opt-in profile so nothing breaks when it's absent.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: worldfin
      POSTGRES_PASSWORD: worldfin
      POSTGRES_DB: worldfin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldfin -d worldfin"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      WORLDFIN_DATABASE_URL: postgresql://worldfin:worldfin@postgres:5432/worldfin
      WORLDFIN_HOST: 0.0.0.0
      WORLDFIN_PORT: "8000"
      # LLM + ingest key come from .env (BYOK or Ollama). Compose reads .env by default.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FINSCRAPE_MODEL: ${FINSCRAPE_MODEL:-auto}
      FINSCRAPE_API_KEY: ${FINSCRAPE_API_KEY:-local-dev-key}
      WORLDFIN_REDIS_URL: ${WORLDFIN_REDIS_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      WORLDFIN_DATABASE_URL: postgresql://worldfin:worldfin@postgres:5432/worldfin
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FINSCRAPE_MODEL: ${FINSCRAPE_MODEL:-auto}
      WORLDFIN_WORKER_INTERVAL_MIN: ${WORLDFIN_WORKER_INTERVAL_MIN:-15}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
