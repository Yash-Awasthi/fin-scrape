name: CI

# Repo default branch is master; WorldFin work lands via feat/** branches.
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  # --- Python: finscrape + WorldFin (server/worker) -------------------------
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worldfin
          POSTGRES_PASSWORD: worldfin
          POSTGRES_DB: worldfin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldfin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # point the integration tests at the service (spacy has no 3.14 wheel → 3.13)
      WORLDFIN_DATABASE_URL: postgresql://worldfin:worldfin@localhost:5432/worldfin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - name: Lint (ruff)
        run: make lint
      - name: Format check (ruff)
        run: make fmt-check
      - name: Type check (pyright — server/ + worker/)
        run: make typecheck
      - name: Phase 0 self-check
        run: make selfcheck
      - name: Tests (finscrape + server + worker, incl. DB integration)
        run: make test

  # --- Web: typecheck + unit (Vitest) + build ------------------------------
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build (Vite)
        run: npm run build

  # --- E2E: Playwright against the built SPA (REST + WS mocked) -------------
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # --- Images: build all three + validate compose --------------------------
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: worldfin-api:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: worldfin-worker:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: false
          tags: worldfin-web:ci
      - name: Validate compose (base + obs overlay)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.obs.yml config -q

  # --- Security scans (advisory: never blocks the merge) -------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (web)
        working-directory: web
        run: npm audit --audit-level=high || true
      - name: pip-audit (server deps)
        run: |
          pipx run pip-audit --progress-spinner=off \
            -r <(printf '%s\n' \
              "fastapi>=0.110" "uvicorn>=0.29" "asyncpg>=0.29" \
              "pydantic>=2.6" "pydantic-settings>=2.2" "prometheus-client>=0.20" \
              "apscheduler>=3.10" "requests>=2.31" "feedparser>=6.0") || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
