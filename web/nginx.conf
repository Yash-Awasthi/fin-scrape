server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the static SPA. Looser CSP than the API (it loads its own
  # scripts/styles, fetches /api, opens a WS, and globe.gl pulls map tiles) — the
  # API responses get the locked-down `default-src 'none'` CSP from the app itself.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'" always;

  # API + WebSocket → the FastAPI service (same-origin for the SPA).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
