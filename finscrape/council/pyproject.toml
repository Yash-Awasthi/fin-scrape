[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldfin-council"
version = "0.1.0"
description = "Multi-agent deliberation council with consensus scoring and judge override for financial news analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "WorldFin", email = "worldfin@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "council", "multi-agent", "financial", "deliberation", "consensus"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Yash-Awasthi/fin-scrape"
Repository = "https://github.com/Yash-Awasthi/fin-scrape"
Issues = "https://github.com/Yash-Awasthi/fin-scrape/issues"

[tool.setuptools]
py-modules = ["__init__", "protocols", "base", "council", "judge", "personas"]
