# Scrape the API (HTTP port) and worker (dedicated metrics port). Both live on the
# compose default network, so service names resolve.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: worldfin-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { component: api }

  - job_name: worldfin-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels: { component: worker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
