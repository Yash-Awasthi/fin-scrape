name: CI

# The quality contract is the Makefile's `ci` target: lint, fmt-check, typecheck,
# selfcheck, test, web-ci, e2e. This workflow runs those same commands so a green
# check means the same thing locally and here.

on:
  push:
    branches: [master, fresh]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 3.13 to match the Makefile (spacy has no 3.14 wheel yet). The old 3.10/3.11/3.12
      # matrix could not have worked: the codebase uses datetime.UTC, which is 3.11+.
      - run: uv python install 3.13
      - name: Install
        run: uv sync -p 3.13 --group server --group dev

      # NEW_DIRS from the Makefile — the vendored finscrape/ tree carries pre-existing
      # lint debt and is out of scope by design (see pyproject [tool.ruff]).
      - name: Lint
        run: |
          uv run -p 3.13 ruff check server worker finscrape/scrapers/world \
            finscrape/ingestors tests/server tests/test_world_phase2.py \
            tests/test_worker_phase3.py tests/test_correlate_phase4.py
      - name: Format check
        run: |
          uv run -p 3.13 ruff format --check server worker finscrape/scrapers/world \
            finscrape/ingestors tests/server tests/test_world_phase2.py \
            tests/test_worker_phase3.py tests/test_correlate_phase4.py
      - name: Typecheck
        run: uv run -p 3.13 pyright
      - name: Selfcheck
        run: uv run -p 3.13 python -m tests.server.selfcheck
      - name: Test
        run: uv run -p 3.13 pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          # The CI reporter is "list", so there is no HTML report — test-results holds
          # the traces and screenshots Playwright writes for a failing spec.
          path: web/test-results
          retention-days: 7

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t fin-scrape-api:scan .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fin-scrape-api:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
