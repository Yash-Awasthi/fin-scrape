# Tail all container logs via the Docker socket, ship to Loki. Parses our one-line
# JSON logs (set WORLDFIN_LOG_JSON=true on api+worker) to label by level.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Best-effort: JSON-format logs become labels; plain lines pass through.
      - json:
          expressions:
            level: level
            logger: logger
            correlation_id: correlation_id
      - labels:
          level:
