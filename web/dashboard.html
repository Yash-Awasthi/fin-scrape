<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fin-scrape | Live Market Dashboard</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #111820;
  --border: #1e2a36;
  --green: #00ff88;
  --red: #ff4444;
  --amber: #ffaa00;
  --blue: #4488ff;
  --text: #c8d0d8;
  --muted: #6b7888;
  --purple: #aa66ff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  overflow-x: hidden;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 16px;
  color: var(--green);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header .status {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--muted);
}
.header .status .live {
  color: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Grid layout */
.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 1px;
  padding: 1px;
  background: var(--border);
  min-height: calc(100vh - 50px);
}

/* Panels */
.panel {
  background: var(--surface);
  padding: 12px;
  position: relative;
}
.panel-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* Price Ticker */
.ticker { grid-column: 1 / -1; }
.ticker-row {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding: 4px 0;
}
.ticker-item {
  display: flex;
  flex-direction: column;
  min-width: 100px;
}
.ticker-symbol { font-weight: bold; color: var(--green); font-size: 14px; }
.ticker-price { font-size: 18px; font-weight: bold; }
.ticker-change { font-size: 11px; }
.ticker-change.up { color: var(--green); }
.ticker-change.down { color: var(--red); }

/* Candlestick Chart */
.chart-area { grid-column: 1 / 3; min-height: 250px; }
.candlestick-chart {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 200px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.candle {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.candle-wick {
  width: 1px;
  background: var(--muted);
}
.candle-body {
  width: 60%;
  min-height: 2px;
  border-radius: 1px;
}
.candle-body.green { background: var(--green); }
.candle-body.red { background: var(--red); }
.chart-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}

/* Sentiment Gauge */
.sentiment { min-height: 250px; }
.gauge-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.gauge {
  width: 160px;
  height: 80px;
  position: relative;
  overflow: hidden;
}
.gauge-bg {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 8px solid var(--border);
  border-bottom-color: var(--green);
  border-left-color: var(--amber);
  border-right-color: var(--red);
  position: absolute;
  top: 0;
}
.gauge-needle {
  width: 3px;
  height: 70px;
  background: var(--text);
  position: absolute;
  bottom: 0;
  left: 50%;
  transform-origin: bottom center;
  transition: transform 0.5s ease;
}
.gauge-value {
  font-size: 28px;
  font-weight: bold;
  color: var(--green);
}
.gauge-label { color: var(--muted); font-size: 11px; }
.sentiment-bars {
  display: flex;
  gap: 2px;
  width: 100%;
  margin-top: 10px;
}
.sentiment-bar {
  height: 20px;
  border-radius: 2px;
  transition: width 0.3s ease;
}
.sentiment-bar.bullish { background: var(--green); }
.sentiment-bar.bearish { background: var(--red); }
.sentiment-bar.neutral { background: var(--muted); }

/* News Feed */
.news-feed { grid-row: span 2; }
.news-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  padding-left: 10px;
  margin-bottom: 4px;
}
.news-item.bullish { border-left-color: var(--green); }
.news-item.bearish { border-left-color: var(--red); }
.news-item .headline { font-size: 12px; color: var(--text); }
.news-item .meta {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}
.news-item .sentiment-badge {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 3px;
  text-transform: uppercase;
  font-weight: bold;
}
.sentiment-badge.bullish { background: rgba(0,255,136,0.15); color: var(--green); }
.sentiment-badge.bearish { background: rgba(255,68,68,0.15); color: var(--red); }

/* Technical Indicators */
.indicators { min-height: 200px; }
.indicator-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.indicator-card {
  background: var(--bg);
  padding: 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.indicator-name { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.indicator-value { font-size: 18px; font-weight: bold; margin: 4px 0; }
.indicator-signal { font-size: 11px; }
.signal-buy { color: var(--green); }
.signal-sell { color: var(--red); }
.signal-hold { color: var(--amber); }
.indicator-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.indicator-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* Council Consensus */
.council { grid-column: 1 / -1; }
.council-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
}
.agent-card {
  text-align: center;
  padding: 12px 8px;
  background: var(--bg);
  border-radius: 4px;
  border: 1px solid var(--border);
  transition: border-color 0.3s;
}
.agent-card:hover { border-color: var(--green); }
.agent-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.agent-name { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.agent-score { font-size: 16px; font-weight: bold; }
.agent-verdict { font-size: 10px; text-transform: uppercase; margin-top: 4px; }

/* Alert Feed */
.alerts { grid-column: 1 / -1; }
.alert-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.alert-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.alert-dot.warning { background: var(--amber); }
.alert-dot.critical { background: var(--red); animation: pulse 1s infinite; }
.alert-dot.info { background: var(--blue); }
.alert-time { color: var(--muted); font-size: 10px; white-space: nowrap; }
.alert-symbol { color: var(--green); font-weight: bold; }

/* Responsive */
@media (max-width: 900px) {
  .dashboard { grid-template-columns: 1fr; }
  .chart-area, .council, .alerts, .ticker, .news-feed { grid-column: 1; grid-row: auto; }
  .council-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 600px) {
  .council-grid { grid-template-columns: repeat(2, 1fr); }
  .indicator-grid { grid-template-columns: 1fr; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>fin-scrape // live</h1>
  <div class="status">
    <span class="live">● LIVE</span>
    <span id="clock">--:--:--</span>
    <span>Feed: <span id="feed-status">connected</span></span>
  </div>
</div>

<div class="dashboard">

  <!-- Price Ticker -->
  <div class="panel ticker">
    <div class="ticker-row" id="ticker"></div>
  </div>

  <!-- Candlestick Chart -->
  <div class="panel chart-area">
    <div class="panel-title">Price History — AAPL</div>
    <div class="candlestick-chart" id="chart"></div>
    <div class="chart-labels">
      <span>1H ago</span><span>45m</span><span>30m</span><span>15m</span><span>Now</span>
    </div>
  </div>

  <!-- Sentiment Gauge -->
  <div class="panel sentiment">
    <div class="panel-title">Market Sentiment</div>
    <div class="gauge-container">
      <div class="gauge">
        <div class="gauge-bg"></div>
        <div class="gauge-needle" id="needle"></div>
      </div>
      <div class="gauge-value" id="sentiment-score">0.00</div>
      <div class="gauge-label">Aggregate Score</div>
      <div class="sentiment-bars" id="sentiment-bars"></div>
    </div>
  </div>

  <!-- News Feed -->
  <div class="panel news-feed">
    <div class="panel-title">Live News Feed</div>
    <div id="news-list"></div>
  </div>

  <!-- Technical Indicators -->
  <div class="panel indicators">
    <div class="panel-title">Technical Indicators</div>
    <div class="indicator-grid" id="indicators"></div>
  </div>

  <!-- Council Consensus -->
  <div class="panel council">
    <div class="panel-title">Council Consensus — 8 Agent Deliberation</div>
    <div class="council-grid" id="council"></div>
  </div>

  <!-- Alert Feed -->
  <div class="panel alerts">
    <div class="panel-title">Active Alerts</div>
    <div id="alert-list"></div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------------
// Mock data
// ---------------------------------------------------------------------------
const SYMBOLS = ['AAPL','MSFT','GOOGL','AMZN','NVDA','TSLA','META','JPM'];
const NEWS = [
  { headline: 'NVDA beats Q3 estimates, revenue up 122% YoY', source: 'Bloomberg', sentiment: 0.85, ticker: 'NVDA' },
  { headline: 'Fed signals potential rate pause amid cooling inflation', source: 'Reuters', sentiment: 0.3, ticker: 'SPY' },
  { headline: 'TSLA recalls 2.4M vehicles over Autopilot concerns', source: 'CNBC', sentiment: -0.6, ticker: 'TSLA' },
  { headline: 'AAPL announces record Services revenue of $22B', source: 'WSJ', sentiment: 0.7, ticker: 'AAPL' },
  { headline: 'MSFT Azure growth accelerates, AI revenue doubles', source: 'Bloomberg', sentiment: 0.8, ticker: 'MSFT' },
  { headline: 'GOOGL antitrust ruling could reshape search market', source: 'FT', sentiment: -0.4, ticker: 'GOOGL' },
  { headline: 'META cuts 10% more staff in efficiency drive', source: 'Reuters', sentiment: -0.2, ticker: 'META' },
  { headline: 'JPMorgan warns of commercial real estate losses', source: 'CNBC', sentiment: -0.5, ticker: 'JPM' },
];

const AGENTS = [
  { name: 'Macro', emoji: '🌍', specialty: 'Macro Trends', score: 0.65, verdict: 'bullish' },
  { name: 'Technical', emoji: '📊', specialty: 'Chart Analysis', score: 0.42, verdict: 'neutral' },
  { name: 'Sentiment', emoji: '💭', specialty: 'News/Social', score: 0.72, verdict: 'bullish' },
  { name: 'Quant', emoji: '🧮', specialty: 'Statistical', score: 0.38, verdict: 'neutral' },
  { name: 'Risk', emoji: '⚠️', specialty: 'Risk Mgmt', score: -0.15, verdict: 'cautious' },
  { name: 'Geopol', emoji: '🌐', specialty: 'Geopolitical', score: 0.22, verdict: 'neutral' },
  { name: 'Value', emoji: '💰', specialty: 'Value Investing', score: 0.55, verdict: 'bullish' },
  { name: 'Momentum', emoji: '🚀', specialty: 'Momentum', score: 0.48, verdict: 'neutral' },
];

// ---------------------------------------------------------------------------
// Render functions
// ---------------------------------------------------------------------------
function renderTicker() {
  const el = document.getElementById('ticker');
  el.innerHTML = SYMBOLS.map(s => {
    const price = (100 + Math.random() * 400).toFixed(2);
    const change = (Math.random() * 6 - 3).toFixed(2);
    const cls = parseFloat(change) >= 0 ? 'up' : 'down';
    const arrow = parseFloat(change) >= 0 ? '▲' : '▼';
    return `<div class="ticker-item">
      <span class="ticker-symbol">${s}</span>
      <span class="ticker-price">$${price}</span>
      <span class="ticker-change ${cls}">${arrow} ${change}%</span>
    </div>`;
  }).join('');
}

function renderChart() {
  const el = document.getElementById('chart');
  const candles = [];
  let price = 150;
  for (let i = 0; i < 30; i++) {
    const open = price;
    const close = open + (Math.random() - 0.48) * 4;
    const high = Math.max(open, close) + Math.random() * 2;
    const low = Math.min(open, close) - Math.random() * 2;
    const green = close >= open;
    const bodyH = Math.max(2, Math.abs(close - open) * 8);
    const wickH = (high - low) * 8;
    candles.push(`<div class="candle">
      <div class="candle-wick" style="height:${wickH}px"></div>
      <div class="candle-body ${green ? 'green' : 'red'}" style="height:${bodyH}px"></div>
    </div>`);
    price = close;
  }
  el.innerHTML = candles.join('');
}

function renderSentiment() {
  const score = 0.35 + Math.random() * 0.3;
  const angle = -90 + score * 180;
  document.getElementById('needle').style.transform = `rotate(${angle}deg)`;
  document.getElementById('sentiment-score').textContent = score.toFixed(2);
  document.getElementById('sentiment-score').style.color =
    score > 0.5 ? 'var(--green)' : score > 0 ? 'var(--amber)' : 'var(--red)';

  const bars = document.getElementById('sentiment-bars');
  const bullish = Math.floor(score * 100);
  const bearish = Math.floor((1 - score) * 60);
  const neutral = 100 - bullish - bearish;
  bars.innerHTML = `
    <div class="sentiment-bar bullish" style="width:${bullish}%" title="${bullish}% bullish"></div>
    <div class="sentiment-bar neutral" style="width:${neutral}%" title="${neutral}% neutral"></div>
    <div class="sentiment-bar bearish" style="width:${bearish}%" title="${bearish}% bearish"></div>`;
}

function renderNews() {
  const el = document.getElementById('news-list');
  el.innerHTML = NEWS.map(n => {
    const cls = n.sentiment > 0.2 ? 'bullish' : n.sentiment < -0.2 ? 'bearish' : '';
    const label = n.sentiment > 0.2 ? 'bullish' : n.sentiment < -0.2 ? 'bearish' : 'neutral';
    const time = Math.floor(Math.random() * 55) + 1;
    return `<div class="news-item ${cls}">
      <div class="headline">${n.headline}</div>
      <div class="meta">
        <span>${n.source} · ${time}m ago</span>
        <span class="sentiment-badge ${label}">${label}</span>
      </div>
    </div>`;
  }).join('');
}

function renderIndicators() {
  const indicators = [
    { name: 'RSI (14)', value: (40 + Math.random() * 30).toFixed(1), max: 100 },
    { name: 'MACD', value: (Math.random() * 2 - 1).toFixed(3), max: 2 },
    { name: 'BB %B', value: (Math.random()).toFixed(2), max: 1 },
    { name: 'VWAP', value: '$' + (150 + Math.random() * 5).toFixed(2), max: 1 },
  ];
  const el = document.getElementById('indicators');
  el.innerHTML = indicators.map(ind => {
    const val = parseFloat(ind.value);
    const pct = ind.name === 'RSI (14)' ? val : (Math.abs(val) / ind.max * 100);
    const signal = ind.name === 'RSI (14)'
      ? (val > 70 ? 'sell' : val < 30 ? 'buy' : 'hold')
      : (val > 0 ? 'buy' : val < 0 ? 'sell' : 'hold');
    const color = signal === 'buy' ? 'var(--green)' : signal === 'sell' ? 'var(--red)' : 'var(--amber)';
    return `<div class="indicator-card">
      <div class="indicator-name">${ind.name}</div>
      <div class="indicator-value" style="color:${color}">${ind.value}</div>
      <div class="indicator-signal signal-${signal}">${signal.toUpperCase()}</div>
      <div class="indicator-bar">
        <div class="indicator-bar-fill" style="width:${Math.min(100, pct)}%;background:${color}"></div>
      </div>
    </div>`;
  }).join('');
}

function renderCouncil() {
  const el = document.getElementById('council');
  el.innerHTML = AGENTS.map(a => {
    const color = a.score > 0.3 ? 'var(--green)' : a.score < 0 ? 'var(--red)' : 'var(--amber)';
    return `<div class="agent-card">
      <div class="agent-avatar" style="background:${color}22;border:2px solid ${color}">${a.emoji}</div>
      <div class="agent-name">${a.name}</div>
      <div class="agent-score" style="color:${color}">${a.score > 0 ? '+' : ''}${a.score.toFixed(2)}</div>
      <div class="agent-verdict" style="color:${color}">${a.verdict}</div>
    </div>`;
  }).join('');
}

function renderAlerts() {
  const alerts = [
    { type: 'warning', symbol: 'TSLA', message: 'Price dropped 3.2% in 5 minutes', time: '2m ago' },
    { type: 'info', symbol: 'NVDA', message: 'Volume spike: 3x average', time: '5m ago' },
    { type: 'critical', symbol: 'JPM', message: 'Breaking: CRE loss warning', time: '8m ago' },
    { type: 'info', symbol: 'AAPL', message: 'Sentiment shift: neutral → bullish', time: '12m ago' },
    { type: 'warning', symbol: 'GOOGL', message: 'Volatility above 2x historical', time: '15m ago' },
  ];
  const el = document.getElementById('alert-list');
  el.innerHTML = alerts.map(a =>
    `<div class="alert-item">
      <div class="alert-dot ${a.type}"></div>
      <span class="alert-symbol">${a.symbol}</span>
      <span>${a.message}</span>
      <span class="alert-time">${a.time}</span>
    </div>`
  ).join('');
}

// Clock
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}

// Initialize
renderTicker();
renderChart();
renderSentiment();
renderNews();
renderIndicators();
renderCouncil();
renderAlerts();
updateClock();
setInterval(updateClock, 1000);
setInterval(() => { renderTicker(); renderSentiment(); }, 3000);
</script>
</body>
</html>
