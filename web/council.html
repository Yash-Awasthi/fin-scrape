<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldFin Council — Live Deliberation</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e14;--surface:#111827;--card:#0d1117;--border:#1e293b;--green:#00ff88;--amber:#ffaa00;--red:#ff4444;--cyan:#06b6d4;--purple:#a855f7;--text:#e2e8f0;--muted:#64748b;--dim:#475569;--mono:'JetBrains Mono','Fira Code','Cascadia Code',monospace}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{text-align:center;padding:32px 20px;border-bottom:1px solid var(--border)}
header h1{font-size:1.8rem;font-weight:800;margin-bottom:4px}
header h1 .accent{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);font-size:0.9rem}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;font-family:var(--mono);letter-spacing:0.5px}
.badge-live{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.3)}
.badge-count{background:rgba(6,182,212,0.1);color:var(--cyan);border:1px solid rgba(6,182,212,0.3)}
.badge-round{background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.3)}
.grid{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;margin-top:20px;min-height:calc(100vh - 180px)}
@media(max-width:1100px){.grid{grid-template-columns:1fr;}}
/* Agent Cards */
.agents-panel{display:flex;flex-direction:column;gap:8px}
.agents-panel h2{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.agent-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;transition:border-color 0.3s}
.agent-card.thinking{border-color:var(--amber);animation:pulse 1.5s infinite}
.agent-card.done{border-color:var(--green)}
.agent-card.waiting{border-color:var(--border);opacity:0.6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,170,0,0)}50%{box-shadow:0 0 12px rgba(255,170,0,0.2)}}
.agent-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:13px;font-weight:600}
.agent-role{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-score{font-family:var(--mono);font-size:14px;font-weight:700;width:36px;text-align:center}
.agent-score.bullish{color:var(--green)}
.agent-score.bearish{color:var(--red)}
.agent-score.neutral{color:var(--amber)}
.typing{display:inline-flex;gap:3px;padding:4px 0}
.typing span{width:5px;height:5px;background:var(--amber);border-radius:50%;animation:typing 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* Main Panel */
.main-panel{display:flex;flex-direction:column;gap:16px}
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.section h2{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin-bottom:12px}
/* Radar Chart */
.radar-container{position:relative;width:100%;aspect-ratio:1;max-width:280px;margin:0 auto}
.radar-svg{width:100%;height:100%}
/* Timeline */
.timeline{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.tl-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:6px 8px;border-radius:6px;transition:background 0.2s}
.tl-item:hover{background:rgba(255,255,255,0.03)}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.tl-time{font-family:var(--mono);color:var(--dim);width:55px;flex-shrink:0}
.tl-text{color:var(--text)}
/* Right Panel */
.side-panel{display:flex;flex-direction:column;gap:16px}
/* Events */
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px}
.event-type{font-size:10px;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;margin-bottom:4px}
.event-type.bullish{color:var(--green)}.event-type.bearish{color:var(--red)}.event-type.neutral{color:var(--amber)}
.event-title{font-size:12px;font-weight:500;margin-bottom:2px}
.event-meta{font-size:10px;color:var(--muted);font-family:var(--mono)}
/* Quotes */
.quote-card{border-left:3px solid var(--cyan);padding:8px 12px;margin-bottom:8px;background:rgba(6,182,212,0.05);border-radius:0 6px 6px 0}
.quote-text{font-size:12px;font-style:italic;color:var(--text);line-height:1.4}
.quote-sentiment{font-size:10px;color:var(--muted);margin-top:4px}
/* Verdict */
.verdict-box{background:linear-gradient(135deg,rgba(0,255,136,0.05),rgba(6,182,212,0.05));border:1px solid rgba(0,255,136,0.2);border-radius:10px;padding:16px;text-align:center;margin-top:8px}
.verdict-label{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.verdict-score{font-size:2.5rem;font-weight:800;font-family:var(--mono);margin:4px 0}
.verdict-label2{font-size:11px;color:var(--muted)}
/* Start button */
.start-btn{display:block;width:100%;padding:12px;border:1px solid var(--green);background:rgba(0,255,136,0.08);color:var(--green);font-weight:600;font-size:14px;border-radius:8px;cursor:pointer;transition:all 0.2s;font-family:inherit}
.start-btn:hover{background:rgba(0,255,136,0.15);box-shadow:0 0 16px rgba(0,255,136,0.15)}
.start-btn:disabled{opacity:0.4;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>🌐 <span class="accent">WorldFin Council</span> — Live Deliberation</h1>
  <p>7 AI analysts debate market events in real-time</p>
  <div style="margin-top:12px;display:flex;justify-content:center;gap:8px">
    <span class="badge badge-live" id="statusBadge">● DEMO</span>
    <span class="badge badge-count" id="roundBadge">Round 0/3</span>
    <span class="badge badge-count" id="eventBadge">0 events</span>
  </div>
</header>
<div class="container">
  <button class="start-btn" id="startBtn" onclick="startDeliberation()">▶ Start Demo Deliberation</button>
  <div class="grid" style="margin-top:16px">
    <!-- Left: Agent Cards -->
    <div class="agents-panel">
      <h2>🤖 Agents</h2>
      <div id="agentCards"></div>
    </div>
    <!-- Center: Radar + Timeline -->
    <div class="main-panel">
      <div class="section">
        <h2>🎯 Consensus Radar</h2>
        <div class="radar-container"><svg class="radar-svg" id="radarSvg" viewBox="0 0 300 300"></svg></div>
        <div class="verdict-box" id="verdictBox" style="display:none">
          <div class="verdict-label">Council Verdict</div>
          <div class="verdict-score" id="verdictScore" style="color:var(--green)">+0.0</div>
          <div class="verdict-label2" id="verdictLabel">Awaiting deliberation</div>
        </div>
      </div>
      <div class="section">
        <h2>⏱️ Deliberation Timeline</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
    <!-- Right: Events + Quotes -->
    <div class="side-panel">
      <div class="section">
        <h2>📡 Detected Events</h2>
        <div id="eventsPanel"></div>
      </div>
      <div class="section">
        <h2>💬 Key Quotes</h2>
        <div id="quotesPanel"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Mock Data ───────────────────────────────────────────────────────────────
const AGENTS = [
  { id:'analyst', name:'Analyst', icon:'📊', color:'#3fb950', weight:1.5, role:'Event extraction & impact' },
  { id:'contrarian', name:'Contrarian', icon:'🔄', color:'#f97316', weight:1.0, role:'Challenges consensus' },
  { id:'risk', name:'Risk', icon:'⚠️', color:'#ef4444', weight:1.2, role:'Downside scenarios' },
  { id:'momentum', name:'Momentum', icon:'📈', color:'#3b82f6', weight:0.8, role:'Sentiment shifts' },
  { id:'fundamentals', name:'Fundamentals', icon:'🏛️', color:'#8b5cf6', weight:1.0, role:'Long-term value' },
  { id:'scout', name:'Scout', icon:'🔍', color:'#06b6d4', weight:0.7, role:'Source reliability' },
  { id:'reviewer', name:'Reviewer', icon:'✅', color:'#10b981', weight:1.4, role:'Quality control' },
];

const MOCK_EVENTS = [
  { type:'bullish', title:'Fed signals rate pause — dovish pivot', tickers:['SPY','QQQ'], magnitude:'high', timeline:'immediate' },
  { type:'bearish', title:'China semiconductor export controls tightened', tickers:['NVDA','AMD'], magnitude:'critical', timeline:'short_term' },
  { type:'neutral', title:'Apple Q3 earnings beat — revenue +12% YoY', tickers:['AAPL'], magnitude:'medium', timeline:'immediate' },
];

const MOCK_QUOTES = [
  { text:'The rate pause is clearly bullish for growth stocks, but the real question is whether this is a genuine pivot or just a pause before more tightening.', sentiment:'bullish', speaker:'Analyst' },
  { text:'Markets are pricing in a soft landing that history suggests is unlikely. We should be cautious about chasing this rally.', sentiment:'bearish', speaker:'Contrarian' },
  { text:'The semiconductor controls could disrupt supply chains for 12-18 months. This is a structural headwind, not a one-quarter event.', sentiment:'bearish', speaker:'Risk' },
];

// Simulated verdicts per agent
const MOCK_VERDICTS = [
  { analyst:3, contrarian:-1, risk:-2, momentum:2, fundamentals:1, scout:2, reviewer:1 },
  { analyst:2, contrarian:-2, risk:-3, momentum:1, fundamentals:0, scout:1, reviewer:0 },
  { analyst:4, contrarian:-1, risk:-1, momentum:3, fundamentals:2, scout:2, reviewer:1 },
];

let state = { round:0, agentIdx:0, running:false, scores:{} };
let timeline = [];

// ── Render ──────────────────────────────────────────────────────────────────
function renderAgents() {
  const el = document.getElementById('agentCards');
  el.innerHTML = AGENTS.map(a => {
    const s = state.scores[a.id];
    const cls = s !== undefined ? (s > 0 ? 'done' : s < 0 ? 'done' : 'done') : state.running && state.agentIdx === AGENTS.indexOf(a) ? 'thinking' : 'waiting';
    const scoreCls = s > 0 ? 'bullish' : s < 0 ? 'bearish' : 'neutral';
    const scoreText = s !== undefined ? (s > 0 ? '+'+s : String(s)) : '—';
    return `<div class="agent-card ${cls}">
      <div class="agent-avatar" style="background:${a.color}22;border:2px solid ${a.color}">${a.icon}</div>
      <div class="agent-info">
        <div class="agent-name">${a.name}</div>
        <div class="agent-role">${a.role}</div>
        ${cls === 'thinking' ? '<div class="typing"><span></span><span></span><span></span></div>' : ''}
      </div>
      <div class="agent-score ${s !== undefined ? scoreCls : ''}">${scoreText}</div>
    </div>`;
  }).join('');
}

function addTimeline(text, color) {
  const now = new Date();
  const ts = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  timeline.unshift({ text, color, ts });
  if (timeline.length > 30) timeline.length = 30;
  renderTimeline();
}

function renderTimeline() {
  document.getElementById('timeline').innerHTML = timeline.map(t =>
    `<div class="tl-item"><div class="tl-dot" style="background:${t.color}"></div><span class="tl-time">${t.ts}</span><span class="tl-text">${t.text}</span></div>`
  ).join('');
}

function renderRadar() {
  const svg = document.getElementById('radarSvg');
  const cx = 150, cy = 150, r = 120;
  const n = AGENTS.length;
  let html = '';
  // Grid rings
  for (let i = 1; i <= 5; i++) {
    const rr = (r * i) / 5;
    let pts = [];
    for (let j = 0; j < n; j++) {
      const angle = (Math.PI * 2 * j) / n - Math.PI / 2;
      pts.push(`${cx + rr * Math.cos(angle)},${cy + rr * Math.sin(angle)}`);
    }
    html += `<polygon points="${pts.join(' ')}" fill="none" stroke="#1e293b" stroke-width="0.5"/>`;
  }
  // Axes
  for (let j = 0; j < n; j++) {
    const angle = (Math.PI * 2 * j) / n - Math.PI / 2;
    html += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(angle)}" y2="${cy + r * Math.sin(angle)}" stroke="#1e293b" stroke-width="0.5"/>`;
    const lx = cx + (r + 18) * Math.cos(angle);
    const ly = cy + (r + 18) * Math.sin(angle);
    html += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="9" font-family="sans-serif">${AGENTS[j].name}</text>`;
  }
  // Data polygon
  let dataPts = [];
  for (let j = 0; j < n; j++) {
    const score = state.scores[AGENTS[j].id] ?? 0;
    const norm = (score + 5) / 10; // -5..+5 → 0..1
    const angle = (Math.PI * 2 * j) / n - Math.PI / 2;
    dataPts.push(`${cx + r * norm * Math.cos(angle)},${cy + r * norm * Math.sin(angle)}`);
  }
  if (Object.keys(state.scores).length > 0) {
    html += `<polygon points="${dataPts.join(' ')}" fill="rgba(0,255,136,0.15)" stroke="var(--green)" stroke-width="1.5"/>`;
    for (let j = 0; j < n; j++) {
      const score = state.scores[AGENTS[j].id] ?? 0;
      const norm = (score + 5) / 10;
      const angle = (Math.PI * 2 * j) / n - Math.PI / 2;
      html += `<circle cx="${cx + r * norm * Math.cos(angle)}" cy="${cy + r * norm * Math.sin(angle)}" r="4" fill="${AGENTS[j].color}"/>`;
    }
  }
  svg.innerHTML = html;
}

function renderEvents() {
  document.getElementById('eventsPanel').innerHTML = MOCK_EVENTS.map(e =>
    `<div class="event-card"><div class="event-type ${e.type}">${e.type} · ${e.magnitude}</div><div class="event-title">${e.title}</div><div class="event-meta">${e.tickers.join(', ')} · ${e.timeline}</div></div>`
  ).join('');
  document.getElementById('eventBadge').textContent = MOCK_EVENTS.length + ' events';
}

function renderQuotes() {
  document.getElementById('quotesPanel').innerHTML = MOCK_QUOTES.map(q =>
    `<div class="quote-card"><div class="quote-text">"${q.text}"</div><div class="quote-sentiment">— ${q.speaker} · <span style="color:${q.sentiment === 'bullish' ? 'var(--green)' : q.sentiment === 'bearish' ? 'var(--red)' : 'var(--amber)'}">${q.sentiment}</span></div></div>`
  ).join('');
}

function showVerdict() {
  const scores = Object.values(state.scores);
  const avg = scores.reduce((a,b) => a + b, 0) / scores.length;
  const el = document.getElementById('verdictBox');
  el.style.display = '';
  document.getElementById('verdictScore').textContent = (avg > 0 ? '+' : '') + avg.toFixed(1);
  document.getElementById('verdictScore').style.color = avg > 0 ? 'var(--green)' : avg < 0 ? 'var(--red)' : 'var(--amber)';
  const label = avg >= 2 ? 'BULLISH — Consider adding positions' : avg >= 0.5 ? 'Mildly bullish — Monitor for confirmation' : avg >= -0.5 ? 'Neutral — Hold / Wait for clarity' : avg >= -2 ? 'Mildly bearish — Reduce exposure' : 'BEARISH — Defensive positioning recommended';
  document.getElementById('verdictLabel').textContent = label;
}

// ── Deliberation Flow ───────────────────────────────────────────────────────
async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startDeliberation() {
  if (state.running) return;
  state.running = true;
  state.round = 0;
  state.scores = {};
  timeline = [];
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = '⏳ Deliberating...';
  document.getElementById('verdictBox').style.display = 'none';

  renderAgents();
  renderRadar();

  for (let round = 0; round < 3; round++) {
    state.round = round + 1;
    document.getElementById('roundBadge').textContent = `Round ${round + 1}/3`;
    addTimeline(`Round ${round + 1} started — ${round === 0 ? 'independent scoring' : 'rebuttal round'}`, 'var(--cyan)');

    for (let i = 0; i < AGENTS.length; i++) {
      state.agentIdx = i;
      renderAgents();
      addTimeline(`${AGENTS[i].name} analyzing...`, AGENTS[i].color);
      await sleep(600 + Math.random() * 800);

      state.scores[AGENTS[i].id] = MOCK_VERDICTS[round][AGENTS[i].id];
      renderAgents();
      renderRadar();
      const score = MOCK_VERDICTS[round][AGENTS[i].id];
      addTimeline(`${AGENTS[i].name} verdict: ${score > 0 ? '+' : ''}${score} ${score > 0 ? '📈' : score < 0 ? '📉' : '➡️'}`, score > 0 ? 'var(--green)' : score < 0 ? 'var(--red)' : 'var(--amber)');
      await sleep(200);
    }
    addTimeline(`Round ${round + 1} complete`, 'var(--dim)');
    await sleep(400);
  }

  showVerdict();
  addTimeline('Council deliberation complete — final verdict rendered', 'var(--green)');
  state.running = false;
  state.agentIdx = -1;
  renderAgents();
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '▶ Run Again';
}

// ── Init ────────────────────────────────────────────────────────────────────
renderAgents();
renderRadar();
renderEvents();
renderQuotes();
addTimeline('Dashboard loaded — click Start to begin demo', 'var(--dim)');
</script>
</body>
</html>
